services:
  lgtm:
    image: grafana/otel-lgtm
    ports:
      - 48300:3000
    #  - 4517:4317
    #  - 4518:4318
    networks:
      - otelnet

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: hbhadb
      POSTGRES_USER: highbyte
      POSTGRES_PASSWORD: password
    ports:
      - 5532:5432
    volumes:
      - hbhadb_postgres_data:/var/lib/postgresql
    networks:
      - pgnetPrimary
      - pgnetSecondary1
      - pgnetSecondary2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highbyte -d hbhadb"]
      interval: 5s
      timeout: 5s
      retries: 10

  highbytePrimaryCreate:
    image: highbyte/intelligence-hub:${IMAGE_VERSION}
    volumes:
      - ./import:/usr/local/highbyte/import
      - highbytePrimaryVol:/usr/local/highbyte/appData
      - highbyteSecondary1Vol:/usr/local/highbyte/appDataSecondary1
      - highbyteSecondary2Vol:/usr/local/highbyte/appDataSecondary2
    networks:
      - pgnetPrimary
    environment:
      HIGHBYTE_STORE_PASSWORD: password
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        cp /usr/local/highbyte/import/primarysettings.json /usr/local/highbyte/appData/intelligencehub-settings.json
        cp /usr/local/highbyte/import/intelligencehub-configuration.json /usr/local/highbyte/appData/intelligencehub-configuration.json
        cd /usr/local/highbyte/runtime
        export LD_PRELOAD=/lib/libgcompat.so.0
        echo "hello"
        java -cp "intelligencehub-runtime.jar:lib/*" com.highbyte.intelligencehub.runtime.HAMain create -n node1Primary -j "jdbc:postgresql://postgres:5432/hbhadb?user=highbyte&password=password"
        while [ ! -f /usr/local/highbyte/appData/intelligencehub-certificatestore.pkcs12 ]; do echo "Waiting for certificatestore.pkcs12..."; sleep 1; done
        cp /usr/local/highbyte/appData/intelligencehub-certificatestore.pkcs12 /usr/local/highbyte/appDataSecondary1/
        cp /usr/local/highbyte/appData/intelligencehub-certificatestore.pkcs12 /usr/local/highbyte/appDataSecondary2/
        echo "Primary node created and certs distributed successfully!"
        echo "goodbye"
        exit 0
# CHECK wait $!
    depends_on:
      postgres:
        condition: service_healthy
    
  highbytePrimary:
    image: highbyte/intelligence-hub:${IMAGE_VERSION}
    ports:
      - 48000:45245
      - 48001:8885
      - 48002:1885
      - 48003:9001
    volumes:
      - highbytePrimaryVol:/usr/local/highbyte/appData
    networks:
      - pgnetPrimary
      - otelnet
      - mqttnet
    environment:
      ACCEPT_EULA: Y
      JDK_JAVA_OPTIONS: >-
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:+CrashOnOutOfMemoryError
      PUBLIC_hostname: highbytePrimary
      HIGHBYTE_STORE_PASSWORD: password
      #URI: "jdbc:postgresql://postgres:5432/hbhadb?user=highbyte&password=password"
      HA_NODE_ID: node1Primary
      HA_POSTGRES_URI: jdbc:postgresql://postgres:5432/hbhadb?user=highbyte&password=password
      START_MODE: HA_INIT
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=PrimaryResource
      OTEL_COLLECTOR_ENDPOINT: http://lgtm:4318
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=PrimaryExtra
        -Dotel.service.name=HBIHExtra
    depends_on:
      highbytePrimaryCreate:
        condition: service_completed_successfully

  highbyteSecondaryNode1:
    extends:
      service: highbytePrimary
    ports: !override
      - 48010:45245
      - 48011:8885
      - 48012:1885
      - 48013:9001
    volumes:
      - highbyteSecondary1Vol:/usr/local/highbyte/appData
    networks: !override
      - pgnetSecondary1
      - otelnet
      - mqttnet
    environment:
      START_MODE: HA_JOIN
      HA_NODE_ID: node1Secondary
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=Secondary1Resource
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=Secondary1Extra
        -Dotel.service.name=HBIHExtra
      PUBLIC_hostname: highbyteSecondaryNode1
    depends_on:
      highbytePrimaryCreate:
        condition: service_completed_successfully

  highbyteSecondaryNode2:
    extends:
      service: highbytePrimary
    ports: !override
      - 48020:45245
      - 48021:8885
      - 48022:1885
      - 48023:9001
    volumes:
      - highbyteSecondary2Vol:/usr/local/highbyte/appData
    networks: !override
      - pgnetSecondary2
      - otelnet
      - mqttnet
    environment:
      START_MODE: HA_JOIN
      HA_NODE_ID: node2Secondary
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=Secondary2Resource
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=Secondary2Extra
        -Dotel.service.name=HBIHExtra
      PUBLIC_hostname: highbyteSecondaryNode2
    depends_on:
      highbytePrimaryCreate:
        condition: service_completed_successfully

  highbyteMqtt:
    image: highbyte/intelligence-hub:${IMAGE_VERSION}
    ports:
      - 48030:45245
      - 48032:1885
    networks:
      - mqttnet
      - otelnet
    volumes:
      - .\import-mqtt\mqttsettings.json:/usr/local/highbyte/import/settings.json
    environment:
      ACCEPT_EULA: Y
      JDK_JAVA_OPTIONS: >-
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:+CrashOnOutOfMemoryError
        -javaagent:lib/opentelemetry-javaagent.jar
        -Dotel.exporter.otlp.endpoint=http://lgtm:4318
        -Dotel.service.name=HighByteIntelligenceHub
        -Dotel.service.instance.id=Mqtt
        -Dotel.exporter.otlp.protocol=http/protobuf
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.metrics.exporter.interval=30000
        -Dotel.traces.sampler=always_off
        -Dotel.instrumentation.enabled=false
        -Dotel.instrumentation.runtime-metrics.enabled=true
        -Dotel.instrumentation.logback-appender.enabled=false
        -Dotel.instrumentation.log4j-appender.enabled=false
        -Dotel.instrumentation.jul-appender.enabled=false
        -Dotel.instrumentation.log4j-context-data.enabled=false
        -Dotel.javaagent.extensions=com.highbyte.intelligencehub.runtime.otel
        -Dotel.javaagent.logging=application
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /usr/local/highbyte/appData/intelligencehub-settings.json ] || 
        cp -r /usr/local/highbyte/import/settings.json /usr/local/highbyte/appData/intelligencehub-settings.json
        exec /usr/local/highbyte/runtime/entrypoint.sh "$$@"
      - --
    command: start

volumes:
  hbhadb_postgres_data:
  highbytePrimaryVol:
  highbyteSecondary1Vol:
  highbyteSecondary2Vol:
  
networks:
  pgnetPrimary:
  pgnetSecondary1:
  pgnetSecondary2:
  otelnet:
  mqttnet:
