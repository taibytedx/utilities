services:
  caddy:
      image: caddy:latest
      ports:
        - "49995:80"
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile
        - caddy-data:/data
        - caddy-config:/config
      networks:
        - pgnet
        - otelnet
        - mqttnet
        - hbnet

  lgtm:
    image: grafana/otel-lgtm
    networks:
      - otelnet
    #ports:
    #  - 3995:3000
    profiles: ["optional", "otel"] # docker compose --profile optional up
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      GF_SERVER_ROOT_URL: http://localhost:49995/lgtm/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: localhost

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: highbyte
      POSTGRES_PASSWORD: password
    #ports: 5432:5432
    volumes:
      - postgresVol:/var/lib/postgresql
      #- ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # Auto-creates tables on first run
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highbyte -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["optional", "postgres"] # docker compose --profile optional up

  initCentralHub:
    image: alpine:latest
    user: 1000:1000
    volumes:
      - ./seedCentral:/seedCentral
      - central-node-data:/central/appData
      - ./seedRemote:/seedRemote
      - remote1-node-data:/remote1/appData
      - staging-node-data:/staging/appData
      - hbmqtt-data:/hbMqtt/appData
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /central/appData/intelligencehub-configuration.json ] ||
        cp -r /seedCentral/. /central/appData
        [ -f /remote1/appData/intelligencehub-configuration.json ] ||
        cp -r /seedRemote/. /remote1/appData
        [ -f /staging/appData/intelligencehub-configuration.json ] ||
        cp -r /seedRemote/. /staging/appData
        [ -f /hbmqtt/appData/intelligencehub-configuration.json ] ||
        cp -r /seedRemote/. /hbMqtt/appData
        exit 0
    profiles: ["init"] # docker compose --profile init up -d initCentralHub

  resetCentralHub:
    extends:
      service: initCentralHub
    command:
      - |
        cp -rf /seedCentral/. /central/appData
        #cp -rf /seedRemote/. /remote1/appData
        #cp -rf /seedRemote/. /staging/appData
        echo "Force-reseeded all nodes from seed files"
    profiles: ["reset"] # docker compose --profile reset up -d resetCentralHub

  highbyteCentralNode:
    image: ${IMAGE_VERSION}
    hostname: CentralHostname
    #ports: 
    #  - 49990:45245
    expose:
      - 45245
      - 8885
    volumes:
      - central-node-data:/usr/local/highbyte/appData
    networks:
      - pgnet
      - otelnet
      - mqttnet
      - hbnet
    environment:
      ACCEPT_EULA: Y
      #HA_NODE_ID: HEYLOOKATME
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=CentralResource
      OTEL_COLLECTOR_ENDPOINT: http://lgtm:4318
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=CentralExtra
        -Dotel.service.name=HBIHExtra
      PUBLIC_hostname: highbyteCentralNode
      HIGHBYTE_STORE_PASSWORD: password
      #HIGHBYTE_AUTOGENERATE_ADMIN_PASSWORD: Y
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 45245 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # JVM startup takes time

  highbyteRemote1Node:
    extends:
      service: highbyteCentralNode
    hostname: Remote1Hostname
    volumes:
      - remote1-node-data:/usr/local/highbyte/appData
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=Remote1Resource
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=Remote1Extra
        -Dotel.service.name=HBIHExtra
      PUBLIC_hostname: highbyteRemote1

  highbyteStagingNode:
    extends:
      service: highbyteCentralNode
    hostname: StagingHostname
    #ports: !override 49992:45245
    volumes:
      - staging-node-data:/usr/local/highbyte/appData
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=StagingResource
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=StagingExtra
        -Dotel.service.name=HBIHExtra
      PUBLIC_hostname: StagingNode

  highbyteMqtt:
    extends:
      service: highbyteCentralNode
    hostname: hbMqttHostname
    volumes:
      - hbmqtt-data:/usr/local/highbyte/appData
    #ports: !override 49993:45245
    expose:
      - 45245
      - 1885
      - 1886
    networks:
      - mqttnet
      - otelnet
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.name=HBIHResource,service.instance.id=hbMqttResource
      OTEL_AGENT_PROPERTIES_EXTRA:  >-
        -Dotel.service.instance.id=HbMqttExtra
        -Dotel.service.name=HBIHExtra
      PUBLIC_hostname: hbMqttNode

volumes:
  postgresVol:
  central-node-data:
  remote1-node-data:
  staging-node-data:
  hbmqtt-data:
  caddy-data:
  caddy-config:

networks:
  pgnet:
  otelnet:
  mqttnet:
  hbnet:
