services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka-net

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9094
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - kafka-net

  ihub:
    image: highbyte/intelligence-hub:4.5.1
    depends_on:
      init-ih:
        condition: service_completed_successfully
    environment:
      ACCEPT_EULA: Y
    volumes:
      - ihub_data:/usr/local/highbyte/appData
    ports:
      - "41450:45245"
    networks:
      - kafka-net
  init-ih:
    image: alpine:latest
    user: 1000:1000
    volumes:
      - ./seed:/seed
      - ihub_data:/ihub/appData
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /ihub/appData/intelligencehub-configuration.json ] ||
        cp -r /seed/. /ihub/appData
        exit 0

volumes:
  ihub_data:

networks:
  kafka-net:
